services:
  - type: web
    name: bus-reservation-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application
    healthCheckPath: /api/locations
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /tmp/bus-reservation-data
